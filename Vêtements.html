    const conteneurProduits = document.getElementById("liste-produits");


  function afficherProduits() {
  conteneurProduits.innerHTML = "";

  vetements.forEach(produit => {
    const carte = `
      <article class="carte-enfants">
        <img src="${produit.image}" alt="${produit.alt}" width="600px">
        <div class="contenu-enfants">
          <h2 class="nom-enfants">${produit.Nom}</h2>
          <span class="prix">${produit.prix} FCA</span>
          <button onclick="ajouterAuPanier(${produit.id})" class="btn-ajouter">Ajouter au panier</button>
        </div>
      </article>
    `;

    conteneurProduits.innerHTML += carte;
  });
}


afficherProduits();

    function ajouterAuPanier(idProduit) {
  // 1. Récupérer le panier enregistré dans le localStorage
  let panier = JSON.parse(localStorage.getItem('panier')) || [];

  // 2. Retrouver l'article dans le tableau vetements
  const produitTrouve = vetements.find(article => article.id === idProduit);

  if (!produitTrouve) {
    console.error("Produit introuvable dans le tableau");
    return;
  }

  // 3. Vérifier si l'article est déjà dans le panier
  const produitExistant = panier.find(item => item.id === idProduit);

  if (produitExistant) {
    produitExistant.quantite += 1;
  } else {
    // 4. Ajouter l'article au panier en utilisant la bonne clé "Nom" (avec majuscule)
    panier.push({
      id: produitTrouve.id,
      nom: produitTrouve.Nom, // <-- CORRECTION : "Nom" avec une majuscule
      prix: produitTrouve.prix,
      image: produitTrouve.image,
      quantite: 1
    });
  }

  // 5. Sauvegarder dans le localStorage
  localStorage.setItem('panier', JSON.stringify(panier));

  alert(`${produitTrouve.Nom} a été ajouté au panier !`); // <-- CORRECTION ici aussi
}
