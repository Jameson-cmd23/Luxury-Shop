<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
        /* Conteneur principal en arrière-plan plein écran ou section Hero */
        .hero-banner {
            position: relative;
            width: 100%;
            height: calc(100vh - 70px); /* Ajuste la hauteur en tenant compte du header */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Piste du carrousel d'arrière-plan */
        .carousel-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 400%; /* 4 images = 400% de largeur */
            height: 100%;
            display: flex;
            animation: defilementContinu 20s infinite ease-in-out;
            z-index: 1;
        }

        .carousel-bg img {
            width: 25%; /* Chaque image prend 1/4 (100% de l'écran) */
            height: 100%;
            object-fit: cover;
            filter: brightness(0.65); /* Assombrit légèrement l'image pour faire ressortir le texte */
        }

        /* Animation Keyframes pour le défilement continu */
        @keyframes defilementContinu {
            0% { transform: translateX(0%); }
            20% { transform: translateX(0%); }
            25% { transform: translateX(-25%); }
            45% { transform: translateX(-25%); }
            50% { transform: translateX(-50%); }
            70% { transform: translateX(-50%); }
            75% { transform: translateX(-75%); }
            95% { transform: translateX(-75%); }
            100% { transform: translateX(0%); }
        }

        /* Contenu superposé sur le carrousel */
        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #ffffff;
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.45); /* Overlay sombre transparent */
            backdrop-filter: blur(4px); /* Effet de flou moderne */
            border-radius: 12px;
            max-width: 700px;
            margin: 0 20px;
        }

        .hero-content h3 {
            font-size: 1.5rem;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .hero-content button {
            padding: 12px 28px;
            font-size: 1rem;
            background-color: #ffffff;
            color: #111111;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .hero-content button:hover {
            background-color: #e0e0e0;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <!-- logo -->
            <div class="logo">
                <a href="Accueil.html">Luxury Shop</a>
            </div>

            <!-- Liens de navigation -->
            <ul class="nav-links" id="nav-links">
                <li class="active">
                    <a href="Accueil.html">
                        <i class="fa-solid fa-house"></i>
                        <span>Accueil</span>
                    </a>
                </li>
                <li>
                    <a href="Chaussures.html">
                        <i class="fa-solid fa-shoe-prints"></i>
                        <span>Chaussures</span>
                    </a>
                </li>
                <li>
                    <a href="Vêtements.html">
                        <i class="fa-solid fa-shirt"></i>
                        <span>Vêtements</span>
                    </a>
                </li>
                <li>
                    <a href="Interieur.html">
                        <i class="fa-solid fa-couch"></i>
                        <span>Accessoires</span>
                    </a>
                </li>
                <li id="Cad">
                    <a href="Panier.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>Panier</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="hero-banner">
        <div class="carousel-bg">
            <img src="https://plus.unsplash.com/premium_photo-1675186049366-64a655f8f537?w=1200&auto=format&fit=crop&q=80" alt="Vêtements">
            <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=1200&auto=format&fit=crop&q=80" alt="Vêtements">
            <img src="https://plus.unsplash.com/premium_photo-1676823553364-a3626c995214?w=1200&auto=format&fit=crop&q=80" alt="Intérieur">
            <img src="https://plus.unsplash.com/premium_photo-1744312220261-200237b9166b?w=1200&auto=format&fit=crop&q=80" alt="Chaussures">
        </div>

        <div class="hero-content">
            <h3>
                Besoin d'articles d'habillement et de décoration ? <br>
                Bienvenue chez <strong>Luxury Shop</strong> ! Ici, vous achetez des articles de qualité à des prix abordables.
            </h3>
            <button id="infos">Plus d'infos</button>
        </div>
    </main>

    <script>
        var btn = document.getElementById('infos');
        if(btn) {
            btn.addEventListener('click', infos);
        }
        function infos(){
            window.open('Infos.html');
        }
    </script>
</body>
</html>
