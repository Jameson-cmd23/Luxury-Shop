<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Shop - Chargement</title>
  <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background-color: #000000;
  overflow: hidden;
}

/* Conteneur plein écran */
#loader-wrapper {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: #000000;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}

/* La vidéo s'adapte à tout l'écran tout en conservant ses proportions */
#loader-video {
  width: 100%;
  height: 100%;
  object-fit: contain; /* Utilisez 'cover' si vous voulez qu'elle remplisse tout l'écran sans bandes noires */
  max-width: 100%;
  max-height: 100%;
}

/* Effet de disparition fluide */
.fade-out {
  opacity: 0;
  visibility: hidden;
}
</style>
<body>

  <!-- Écran de chargement avec vidéo -->
  <div id="loader-wrapper">
    <video id="loader-video" autoplay muted playsinline>
      <!-- Remplacez le chemin par le nom exact de votre fichier vidéo MP4 -->
      <source src="Black Elegant Woman Fashion Brand Logo.mp4" type="video/mp4">
      Votre navigateur ne supporte pas la lecture de vidéos.
    </video>
  </div>

  <script >
    // URL de la page d'accueil vers laquelle rediriger
const HOME_PAGE_URL = "Accueil.html";

document.addEventListener("DOMContentLoaded", () => {
  const video = document.getElementById("loader-video");
  const loader = document.getElementById("loader-wrapper");

  // Détecte quand la vidéo se termine
  video.addEventListener("ended", () => {
    // 1. Applique l'effet de fondu sortant
    loader.classList.add("fade-out");

    // 2. Redirige vers la page d'accueil à la fin de la transition CSS (800ms)
    setTimeout(() => {
      window.location.href = HOME_PAGE_URL;
    }, 800);
  });

  // Sécurité (au cas où la vidéo met du temps à se lancer)
  video.play().catch((error) => {
    console.log("Erreur de lecture vidéo :", error);
  });
});
  </script>
</body>
</html>
